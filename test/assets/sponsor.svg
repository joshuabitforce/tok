<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img"
     aria-label="TOK sponsor de torneos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- fondo -->
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <!-- scanlines sutiles -->
  <g opacity="0.05" fill="#fff">
    <rect y="0"   width="800" height="1" /><rect y="6"  width="800" height="1"/>
    <rect y="12"  width="800" height="1" /><rect y="18" width="800" height="1"/>
  </g>

  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- ===== Trofeo (centro) ===== -->
    <g transform="translate(400 330)" opacity="0.95">
      <!-- copa -->
      <path d="M -90 -120 H 90 V -70 Q 90 40 0 70 Q -90 40 -90 -70 Z" fill="#111"/>
      <!-- asas -->
      <path d="M -90 -110 q -70 0 -70 55 q 0 45 60 50"/>
      <path d="M  90 -110 q  70 0  70 55 q 0 45 -60 50"/>
      <!-- tallo y base -->
      <path d="M 0 70 V 120"/>
      <path d="M -55 120 H 55"/>
      <path d="M -85 175 q 0 -55 85 -55 q 85 0 85 55 Z" fill="#111"/>
      <!-- estrella -->
      <path d="M 0 -78 l 13 27 30 4 -22 21 6 30 -27 -15 -27 15 6 -30 -22 -21 30 -4 Z"
            fill="#fff" stroke="none"/>
    </g>

    <!-- ===== Pelota de fútbol (izq) ===== -->
    <g transform="translate(205 600)" opacity="0.9">
      <circle r="75" fill="#111"/>
      <path d="M 0 -36 l 34 25 -13 40 -42 0 -13 -40 Z" fill="#fff" stroke="#fff" stroke-width="4"/>
      <path d="M 0 -75 V -36 M 75 -23 L 34 -11 M 46 62 L 21 29 M -46 62 L -21 29 M -75 -23 L -34 -11"/>
    </g>

    <!-- ===== Pelota de básquet (der) ===== -->
    <g transform="translate(595 600)" opacity="0.9">
      <circle r="75" fill="#111"/>
      <path d="M -75 0 H 75 M 0 -75 V 75"/>
      <path d="M -53 -53 Q 0 0 53 53 M 53 -53 Q 0 0 -53 53"/>
    </g>

    <!-- ===== Camiseta (abajo) ===== -->
    <g transform="translate(400 815)" opacity="0.95">
      <path d="M -120 -55 L -55 -85 Q 0 -55 55 -85 L 120 -55 L 95 5 L 60 -10 V 95 H -60 V -10 L -95 5 Z"
            fill="#111"/>
      <path d="M -55 -85 Q 0 -40 55 -85"/>
      <text x="0" y="55" text-anchor="middle" font-family="Arial Black, sans-serif"
            font-size="58" font-weight="900" fill="#fff" stroke="none">10</text>
    </g>
  </g>

  <!-- ===== Texto ===== -->
  <g text-anchor="middle" fill="#fff" font-family="Arial Black, Arial, sans-serif">
    <text x="400" y="120" font-size="46" font-weight="900" letter-spacing="8">SPONSOR</text>
    <text x="400" y="170" font-size="30" font-weight="700" letter-spacing="14"
          fill="#ffffff" opacity="0.7">DE TORNEOS</text>
    <text x="400" y="945" font-size="34" font-weight="900" letter-spacing="6">TOK
      <tspan fill="#ffffff" opacity="0.55"> × </tspan>SPORTA</text>
  </g>
</svg>
